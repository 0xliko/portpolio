<html>
<body onload="init()">
<script src="three.js"></script>


<script src="particle.js"></script>
<script src="drawParticles.js"></script>
<script>
    var container;
    var scene, camera, renderer, raycaster;
    var backMesh;
    function init(){
        container = document.getElementById("drawpanel");
        camera = new THREE.PerspectiveCamera(50.0, window.innerWidth / window.innerHeight, 0.1, 1000);
        //camera = new THREE.OrthographicCamera(-100, 100, 100, -100, 0.1, 10);
        camera.updateProjectionMatrix();
        camera.position.set(0, 0, 500);
        camera.lookAt(new THREE.Vector3(0, 0, 0));

        renderer = new THREE.WebGLRenderer( { antialias: true } );
        renderer.setClearColor( 0x000000 );
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( container.clientWidth, container.clientHeight);
        container.appendChild( renderer.domElement );

        scene = new THREE.Scene();

        backMesh = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000, 1, 1), new THREE.MeshBasicMaterial({color: 0x000000}));
        backMesh.position.z = -1;
        scene.add(backMesh);

        raycaster = new THREE.Raycaster();
//        var geo = new THREE.BoxGeometry(10, 10, 10, 1, 1, 1);
//        var mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0xff0000}));
//        scene.add(mesh);

        var light = new THREE.AmbientLight(0xffffff, 0.8 );
        scene.add( light );

        document.addEventListener("mousemove", onMouseMove, false);
        document.addEventListener("resize", onWindowResize, false);

        mouseX = 0;
        mouseY = 1000;
        createParticles();


    }

    function onMouseMove(event){
        var mouse = new THREE.Vector2();
        mouse.set( ( event.clientX / container.clientWidth ) * 2 - 1, - ( event.clientY / container.clientHeight ) * 2 + 1 );
        raycaster.setFromCamera( mouse, camera );

        var tmp = [];
        tmp.push(backMesh);
        var objects = raycaster.intersectObjects(tmp);
        if(objects.length > 0){
            mouseX = objects[0].point.x;
            mouseY = objects[0].point.y;
        }
    }

    function onWindowResize() {

        camera.aspect =  container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(  container.clientWidth, container.clientHeight );

    }

    window.onload = function(){
        init();
        animate();
    };

    function animate(){
        requestAnimationFrame(animate);

        render();
    }

    function render(){
        var i;
        for(i = 0; i < particles.length; i++){
            particles[i].updatePos();
        }
        renderer.render(scene, camera);
    }
</script>
<div style="width:100%; height: 100%" id="drawpanel">
</div>
</body>
</html>
